<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>打字上班族：七天試用期</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0c0f14;overflow:hidden;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;color:#1f2937;user-select:none;-webkit-user-select:none}
#stage{position:absolute;left:50%;top:50%;width:1000px;height:640px;margin:-320px 0 0 -500px;transform-origin:50% 50%;overflow:hidden;background:#222;border-radius:6px}
.scr{position:absolute;inset:0;display:none}
.scr.on{display:block}
.bg{position:absolute;inset:0}
.bg svg{display:block}
.dim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,18,32,.5),rgba(10,18,32,.82))}
button{font-family:inherit;cursor:pointer}
.btn{border:0;border-radius:10px;padding:11px 22px;font-size:17px;font-weight:700;background:#1f6feb;color:#fff;box-shadow:0 2px 0 #174ea6}
.btn:hover{background:#3b82f6}
.btn.ghost{background:#e5e9f0;color:#334155;box-shadow:0 2px 0 #b9c2cf}
.btn.ghost:hover{background:#d5dbe5}
.btn.danger{background:#c0392b;box-shadow:0 2px 0 #8e2a20}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:8px}
.row{display:flex;gap:10px;flex-wrap:wrap}

#title .box{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:540px;text-align:center;color:#fff}
#title h1{font-size:46px;margin:0 0 6px;letter-spacing:3px;text-shadow:0 3px 14px rgba(0,0,0,.55)}
#title .sub{font-size:18px;color:#cfe0f5;margin-bottom:22px}
#title .panel{background:rgba(247,248,250,.97);color:#1f2937;border-radius:14px;padding:22px 26px;text-align:left}
#title label{font-weight:700;font-size:15px;color:#334155}
#nameIn{width:100%;font-size:20px;padding:10px 12px;border:2px solid #b8c2d0;border-radius:8px;font-family:inherit;margin:6px 0 14px;user-select:text;-webkit-user-select:text}
#nameIn:focus{outline:none;border-color:#1f6feb}
#saveInfo{font-size:14px;color:#475569;margin:0 0 12px;min-height:20px}
#title .note{margin-top:14px;font-size:13px;color:#b9c8dc}
.err{color:#c0392b;font-size:14px;min-height:20px;margin:-8px 0 8px}

#hub .wrapH{position:absolute;inset:0;padding:18px 26px;color:#fff;display:flex;flex-direction:column}
#hub h2{margin:0;font-size:26px}
#hub .stat{font-size:14px;color:#cfe0f5;margin-top:2px}
#hub .top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
#hubList{flex:1;display:flex;flex-direction:column;gap:7px;min-height:0}
.crow{display:flex;align-items:center;background:rgba(247,248,250,.95);border-radius:10px;padding:6px 12px;gap:14px;color:#1f2937;flex:1}
.crow.lock{opacity:.5}
.ctitle{width:230px}
.ctitle b{display:block;font-size:16px}
.ctitle small{color:#64748b;font-size:12px}
.lvls{display:flex;gap:8px;flex:1}
.lv{flex:1;border:0;border-radius:8px;background:#e5e9f0;color:#1f2937;font-size:17px;font-weight:700;padding:2px 0;line-height:1.1}
.lv span{display:block;font-size:12px;color:#d28a00;letter-spacing:1px;min-height:14px}
.lv:hover:not(:disabled){background:#cfe0ff}
.lv:disabled{opacity:.45;cursor:not-allowed}
.lv.cur{outline:3px solid #1f6feb}

#bgG{position:absolute;inset:0}
#mon{position:absolute;left:184px;top:34px;width:632px;height:312px;background:#e9eef5;border-radius:3px;overflow:hidden;display:flex;flex-direction:column}
#mon.shake{animation:shake .25s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#mon .tb{height:30px;background:#1f3a5f;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:14px;flex:none}
#mon .main{flex:1;display:flex;gap:10px;padding:10px;min-height:0}
.mail{flex:1;background:#fff;border:1px solid #cbd5e1;border-radius:4px;display:flex;flex-direction:column;min-width:0}
.mh{background:#dbe5f1;padding:6px 10px;font-size:12px;line-height:1.6;color:#334155;flex:none}
#prompt{flex:1;padding:10px 14px;font-family:Consolas,Menlo,"Courier New",monospace;font-size:26px;line-height:1.55;white-space:pre-wrap;overflow-wrap:break-word;overflow:hidden;color:#9aa4b2}
.c.d{color:#2f7d32}
.c.cur{background:#fac775;color:#412402;border-radius:2px}
.c.err{background:#f09595;color:#501313}
#hint{border-top:1px solid #e2e8f0;padding:6px 10px;font-size:13px;color:#475569;min-height:42px;flex:none}
#hint b{color:#b45309;font-size:16px}
.side{width:176px;display:flex;flex-direction:column;gap:6px;font-size:13px;flex:none}
.side .st{background:#fff;border:1px solid #cbd5e1;border-radius:4px;padding:5px 8px}
.side label{display:block;font-size:11px;color:#64748b}
.side b{font-size:16px;color:#1f3a5f}
.bar{height:10px;background:#e2e8f0;border-radius:5px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;width:100%;background:#4caf50;transition:width .2s,background .2s}
.two{display:flex;gap:6px}
.two .st{flex:1}
.boss{display:flex;align-items:flex-end;gap:6px;flex:1;min-height:0}
.boss .pt{width:50px;height:58px;flex:none;background:#c9d6e6;border-radius:6px;overflow:hidden}
.boss .pt svg{width:100%;height:100%}
.bubble{background:#fff7e6;border:1px solid #f0a020;border-radius:8px;font-size:12px;padding:5px 7px;color:#633806;line-height:1.35;flex:1}
#mon .tk{height:24px;background:#1f2937;color:#d3d1c7;display:flex;align-items:center;justify-content:space-between;padding:0 10px;font-size:12px;flex:none}
#mon .tk i{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:6px;vertical-align:-2px}

#kb{position:absolute;left:0;top:0;width:1000px;height:640px;pointer-events:none}
#kb .k rect{fill:#c3c7ce;stroke:#8d939c;stroke-width:1}
#kb .k text{fill:#6b7280;font-size:11px;text-anchor:middle;font-family:inherit}
#kb .k.L text{font-size:16px;font-weight:700}
#kb .k.live rect{fill:#f2f4f7}
#kb .k.live text{fill:#2d3340}
#kb .k.next rect{fill:#fac775;stroke:#ba7517;stroke-width:2}
#kb .k.next text{fill:#412402}
#kb .k.ok rect{fill:#97c459}
#kb .k.bad rect{fill:#f09595}

.ov{position:absolute;inset:0;background:rgba(8,12,20,.62);display:none;align-items:center;justify-content:center;z-index:20}
.ov.on{display:flex}
.card{background:#f7f8fa;border-radius:14px;padding:24px 30px;width:580px;box-shadow:0 12px 40px rgba(0,0,0,.45);color:#1f2937}
.card .kick{font-size:14px;color:#64748b}
.card h2{margin:4px 0 8px;font-size:30px}
.card .story{font-size:17px;line-height:1.6;margin:0 0 14px}
.chips{margin:0 0 12px;font-size:15px;color:#334155}
.chips span{display:inline-block;min-width:30px;text-align:center;background:#fac775;color:#412402;border-radius:6px;padding:2px 8px;margin:0 4px 4px 0;font-weight:700;font-family:Consolas,Menlo,monospace}
.chips em{font-style:normal;background:#dbe5f1;border-radius:6px;padding:2px 10px;font-weight:700}
.meta{font-size:13px;color:#64748b;margin-bottom:16px}
#cd{font-size:140px;font-weight:900;color:#fff;text-shadow:0 6px 24px rgba(0,0,0,.6)}
.stars{font-size:38px;color:#e0a000;letter-spacing:4px;margin:2px 0 6px}
.res{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0 14px}
.res div{background:#e9eef5;border-radius:8px;padding:8px;text-align:center;font-size:12px;color:#64748b}
.res b{display:block;font-size:20px;color:#1f3a5f}

#dlgOv{position:absolute;inset:0;display:none;z-index:15;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.45))}
#dlgOv.on{display:block}
.dlg{position:absolute;left:28px;right:28px;bottom:22px;height:176px;background:rgba(15,23,36,.95);border:2px solid #5a6b85;border-radius:12px;display:flex;color:#fff;padding:14px 18px;gap:16px}
.dlg .pt{width:120px;height:140px;flex:none;align-self:center;background:#35465f;border-radius:10px;overflow:hidden}
.dlg .pt svg{width:100%;height:100%}
.dlg .tx{flex:1;display:flex;flex-direction:column}
.dlg .nm{display:inline-block;align-self:flex-start;background:#1f6feb;border-radius:6px;padding:2px 12px;font-size:15px;font-weight:700;margin-bottom:8px}
.dlg .nm.narr{background:#6b7280}
.dlg .tt{font-size:21px;line-height:1.6;flex:1}
.dlg .nx{align-self:flex-end;font-size:13px;color:#9fb3cc}
.dlg .nx u{cursor:pointer;margin-left:14px}
.blink{animation:bl 1s infinite}
@keyframes bl{50%{opacity:.25}}

#toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:#1f2937;color:#fff;padding:9px 18px;border-radius:8px;font-size:15px;z-index:60;display:none}
#modal textarea{width:100%;height:120px;font-size:12px;font-family:Consolas,monospace;border:2px solid #b8c2d0;border-radius:8px;padding:8px;user-select:text;-webkit-user-select:text;resize:none}
#soundBtn{position:absolute;right:14px;top:12px;z-index:30}
#endBox{text-align:center}
#endBox h1{font-size:40px;margin:8px 0}
#musicBtn{position:absolute;right:100px;top:12px;z-index:30}
#kb .k.dn{transform:translateY(2px)}
.rwL{display:flex;align-items:center;gap:10px;background:#fff7e6;border:1px solid #f0c26b;border-radius:10px;padding:8px 12px;margin:0 0 14px;font-size:14px;color:#633806}
.rwL svg{flex:none}
.rew{display:flex;align-items:center;gap:14px;background:#fff7e6;border:2px solid #f0a020;border-radius:12px;padding:10px 14px;margin:0 0 12px;text-align:left}
.rew .rIc{animation:pop .7s cubic-bezier(.2,1.4,.4,1) both;flex:none;line-height:0}
.rew b{font-size:17px;color:#7a4a00}
.rew small{display:block;font-size:13px;color:#8a6a30;margin-top:2px}
.rew .gain{margin-left:auto;font-weight:700;color:#2f7d32;font-size:16px;white-space:nowrap}
.promo{background:#e7f3ff;border:2px solid #378add;border-radius:10px;padding:8px 12px;margin:0 0 12px;color:#0c447c;font-weight:700}
@keyframes pop{0%{transform:scale(.2) rotate(-25deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
#colGrid{margin:10px 0}
.colRow{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.colRow .cl{width:170px;font-size:13px;color:#475569;font-weight:700}
.colCell{width:78px;height:50px;background:#e9eef5;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:2px solid transparent}
.colCell.got{background:#fff7e6;border-color:#f0c26b}
.colCell.sel{border-color:#1f6feb}
.colCell .q{font-size:22px;color:#aab4c3;font-weight:700}
#colDesc{background:#f1f5f9;border-radius:8px;padding:8px 12px;font-size:14px;min-height:40px;color:#334155;margin-bottom:10px}
</style>
</head>
<body>
<div id="stage">

  <div id="title" class="scr on">
    <div class="bg" id="bgT"></div><div class="dim"></div>
    <div class="box">
      <h1>打字上班族</h1>
      <div class="sub">七天試用期・星辰貿易公司</div>
      <div class="panel">
        <label for="nameIn">你的名字（最多 10 個字）</label>
        <input id="nameIn" maxlength="10" autocomplete="off" placeholder="例如：小明">
        <div class="err" id="nameErr"></div>
        <div id="saveInfo"></div>
        <div class="row">
          <button class="btn" id="btnNew">開始新遊戲</button>
          <button class="btn ghost" id="btnCont">繼續遊戲</button>
          <button class="btn ghost" id="btnCode">存檔代碼</button>
        </div>
      </div>
      <div class="note">遊戲會自動存檔在這台電腦的瀏覽器裡。請使用實體鍵盤，並把輸入法切換成英文。</div>
    </div>
  </div>

  <div id="hub" class="scr">
    <div class="bg" id="bgH"></div><div class="dim"></div>
    <div class="wrapH">
      <div class="top">
        <div><h2 id="hubName"></h2><div class="stat" id="hubStat"></div></div>
        <div class="row" style="margin-right:176px">
          <button class="btn ghost sm" id="hCol">收藏櫃</button>
          <button class="btn ghost sm" id="hCode">存檔代碼</button>
          <button class="btn ghost sm" id="hTitle">回標題</button>
        </div>
      </div>
      <div id="hubList"></div>
    </div>
  </div>

  <div id="game" class="scr">
    <div id="bgG"></div>
    <svg id="deskFx" viewBox="0 0 1000 640" style="position:absolute;left:0;top:0;width:1000px;height:640px;pointer-events:none" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="mon">
      <div class="tb"><span id="tbL">待機中</span><span id="tbM"></span><span id="tbR">分數 0</span></div>
      <div class="main">
        <div class="mail">
          <div class="mh"><b>收件人</b>　<span id="mTo">林經理</span><br><b>主旨</b>　<span id="subj">（尚未開始）</span></div>
          <div id="prompt"></div>
          <div id="hint"></div>
        </div>
        <div class="side">
          <div class="st"><label>主管信任度</label><div class="bar"><i id="trustBar"></i></div></div>
          <div class="two">
            <div class="st"><label>剩餘時間</label><b id="timeV">--</b></div>
            <div class="st"><label>進度</label><b id="progV">0/0</b></div>
          </div>
          <div class="two">
            <div class="st"><label>速度</label><b id="wpmV">0</b></div>
            <div class="st"><label>正確率</label><b id="accV">100%</b></div>
          </div>
          <div class="boss"><div class="pt" id="bossPt"></div><div class="bubble" id="bossTx">好好打，我在看。</div></div>
        </div>
      </div>
      <div class="tk"><span><i style="background:#378add"></i><i style="background:#5dcaa5"></i><i style="background:#ef9f27"></i>星辰貿易內部系統</span><span id="tkClock">08:30</span></div>
    </div>
    <svg id="kb" viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>

  <div id="dlgOv"><div class="dlg">
    <div class="pt" id="dlgPt"></div>
    <div class="tx"><span class="nm" id="dlgNm"></span><div class="tt" id="dlgTx"></div>
      <div class="nx"><span class="blink">按 Enter 或點一下繼續</span><u id="dlgSkip">跳過劇情</u></div></div>
  </div></div>

  <div class="ov" id="ovBrief"><div class="card">
    <div class="kick" id="bK"></div><h2 id="bT"></h2><p class="story" id="bS"></p>
    <div class="chips" id="bC"></div><div class="meta" id="bM"></div>
    <div class="rwL" id="bR"></div>
    <div class="row"><button class="btn" id="bGo">開始上班（Enter）</button><button class="btn ghost" id="bBack">回關卡選單</button></div>
  </div></div>

  <div class="ov" id="ovCd"><div id="cd">3</div></div>

  <div class="ov" id="ovRes"><div class="card" id="resCard"></div></div>

  <div class="ov" id="ovPause"><div class="card" style="width:420px;text-align:center">
    <h2>暫停中</h2><p class="story">喝口咖啡，休息一下。</p>
    <div class="row" style="justify-content:center"><button class="btn" id="pResume">繼續（Esc）</button><button class="btn ghost" id="pQuit">回關卡選單</button></div>
  </div></div>

  <div class="ov" id="ovEnd"><div class="card" id="endBox" style="width:620px"></div></div>

  <div class="ov" id="modal"><div class="card" style="width:560px">
    <h2 style="font-size:24px;margin:0 0 6px">存檔代碼</h2>
    <p class="story" style="font-size:14px;margin:0 8px 10px 0">複製這段文字，就能在別的電腦或瀏覽器貼上，接續進度。</p>
    <textarea id="codeTa" spellcheck="false"></textarea>
    <div class="err" id="codeErr" style="margin:6px 0"></div>
    <div class="row"><button class="btn sm" id="codeCopy">複製代碼</button><button class="btn sm" id="codeLoad">匯入這段代碼</button><button class="btn sm ghost" id="codeClose">關閉</button></div>
  </div></div>

  <div class="ov" id="ovCol"><div class="card" style="width:880px;padding:18px 24px">
    <div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0;font-size:24px">辦公室收藏櫃</h2><span id="colStat" style="font-size:14px;color:#64748b"></span></div>
    <div id="colGrid"></div><div id="colDesc"></div>
    <button class="btn sm ghost" id="colClose">關閉（Esc）</button>
  </div></div>

  <button class="btn ghost sm" id="musicBtn">音樂：開</button>
  <button class="btn ghost sm" id="soundBtn">音效：開</button>
  <div id="toast"></div>
</div>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var SKEY='officeTypingSaveV1',MKEY='officeTypingMuteV1';
var save=null,mute=false,mode='title';

/* ---------- 存檔 ---------- */
function readSave(){try{var s=localStorage.getItem(SKEY);if(s){var o=JSON.parse(s);if(o&&typeof o.name==='string')return o}}catch(e){}return null}
function writeSave(){try{localStorage.setItem(SKEY,JSON.stringify(save))}catch(e){}}
function newSave(name){return{name:name,unlocked:1,stars:{},best:{},seen:{},done:{},coins:0,ver:1}}
try{mute=localStorage.getItem(MKEY)==='1'}catch(e){}
save=readSave();
function encodeSave(s){return btoa(unescape(encodeURIComponent(JSON.stringify(s))))}
function decodeSave(t){var o=JSON.parse(decodeURIComponent(escape(atob(t.trim()))));
  if(!o||typeof o.name!=='string'||typeof o.unlocked!=='number')throw new Error('bad');
  o.unlocked=Math.max(1,Math.min(35,o.unlocked|0));o.stars=o.stars||{};o.best=o.best||{};o.seen=o.seen||{};o.done=o.done||{};o.coins=o.coins||0;return o}

/* ---------- 工具 ---------- */
function pick(a){return a[Math.random()*a.length|0]}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.random()*(i+1)|0;var t=a[i];a[i]=a[j];a[j]=t}return a}
function rint(a,b){return a+(Math.random()*(b-a+1)|0)}
var toastT=null;
function toast(t){var e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toastT);toastT=setTimeout(function(){e.style.display='none'},2200)}
var AU={ctx:null,mg:null,sg:null,nb:null};
var musicOff=false;try{musicOff=localStorage.getItem('officeTypingMusicV1')==='1'}catch(e){}
function auInit(){
  if(AU.ctx){if(AU.ctx.state==='suspended')AU.ctx.resume();return true}
  try{
    var C=window.AudioContext||window.webkitAudioContext;if(!C)return false;
    var c=new C();AU.ctx=c;
    AU.mg=c.createGain();AU.mg.gain.value=musicOff?0:1;AU.mg.connect(c.destination);
    AU.sg=c.createGain();AU.sg.gain.value=1;AU.sg.connect(c.destination);
    var len=c.sampleRate*2,b=c.createBuffer(1,len,c.sampleRate),d=b.getChannelData(0);
    for(var i=0;i<len;i++)d[i]=Math.random()*2-1;AU.nb=b;
    var rs=c.createBufferSource();rs.buffer=b;rs.loop=true;var rf=c.createBiquadFilter();rf.type='lowpass';rf.frequency.value=320;
    var rg=c.createGain();rg.gain.value=.014;rs.connect(rf);rf.connect(rg);rg.connect(AU.mg);rs.start();
    musicStart();return true
  }catch(e){return false}}
function nz(t,dur,freq,q,type,vol,dest,rate){
  var c=AU.ctx,sr=c.createBufferSource();sr.buffer=AU.nb;sr.playbackRate.value=rate||1;
  var f=c.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;
  var g=c.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.002);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  sr.connect(f);f.connect(g);g.connect(dest||AU.sg);sr.start(t,Math.random()*1.4);sr.stop(t+dur+.03)}
function tone(t,f,dur,type,vol,dest,att){
  var c=AU.ctx,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+(att||.005));g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(dest||AU.sg);o.start(t);o.stop(t+dur+.05)}
function snd(f,d,t,v){if(mute||!AU.ctx)return;try{tone(AU.ctx.currentTime,f,d,t||'square',v||.03,AU.sg,.003)}catch(e){}}
function keySound(id,up){
  if(mute||!AU.ctx)return;
